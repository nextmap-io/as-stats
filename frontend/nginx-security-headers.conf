# Security headers, included by every context of nginx.conf that sends a
# response. nginx drops server-level add_header directives in any location
# that defines its own add_header (as /assets/ does for Cache-Control), so
# each such location must include this file again.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
