# AS-Stats production deployment using pre-built GHCR images.
# No build step required — just configure .env and run:
#
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Prerequisites:
# - Docker 24+ with Compose v2
# - Copy .env.example to .env and configure passwords
# - Forward UDP 2055 (NetFlow) and 6343 (sFlow) to this host
# - Put a reverse proxy (Caddy/nginx) in front for HTTPS

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    restart: unless-stopped
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      # Caps system.*_log growth — they share the data volume and are
      # unbounded by default. Mount the FILE, not the directory: a directory
      # bind-mount masks the image's own docker_related_config.xml and
      # ClickHouse silently falls back to listening on loopback only.
      - ./clickhouse/config.d/system-logs-ttl.xml:/etc/clickhouse-server/config.d/system-logs-ttl.xml:ro
    # The collector runs with network_mode: host (to see real router IPs), so it
    # reaches ClickHouse over the host loopback rather than the compose bridge —
    # without this mapping nothing listens on 127.0.0.1:9000 and every batch
    # INSERT fails. Bound to loopback only: never expose 9000 publicly.
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DB: asstats
      CLICKHOUSE_USER: asstats
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 8G

  migrate:
    image: ghcr.io/nextmap-io/as-stats-migrate:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DATABASE: asstats
      CLICKHOUSE_USER: asstats
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}"
      MIGRATE_AUTO_BASELINE: "${MIGRATE_AUTO_BASELINE:-true}"
      MIGRATE_TIMEOUT: "${MIGRATE_TIMEOUT:-30m}"
    depends_on:
      clickhouse:
        condition: service_healthy

  collector:
    image: ghcr.io/nextmap-io/as-stats-collector:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Use host networking so the collector sees real router IPs
    # (Docker NAT replaces source IPs, breaking link enrichment)
    network_mode: host
    environment:
      CLICKHOUSE_ADDR: "127.0.0.1:9000"
      CLICKHOUSE_DATABASE: asstats
      CLICKHOUSE_USER: asstats
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
      COLLECTOR_LISTEN_NETFLOW: ":2055"
      COLLECTOR_LISTEN_SFLOW: ":6343"
      COLLECTOR_BATCH_SIZE: "10000"
      COLLECTOR_FLUSH_INTERVAL: "5s"
      COLLECTOR_WORKERS: "4"
      LOCAL_AS: "${LOCAL_AS:-}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 2G

  api:
    image: ghcr.io/nextmap-io/as-stats-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DATABASE: asstats
      CLICKHOUSE_USER: asstats
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
      API_LISTEN_ADDR: ":8080"
      API_CORS_ORIGINS: "${API_CORS_ORIGINS:-https://as-stats.example.com}"
      AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      ALLOW_UNAUTHENTICATED: "${ALLOW_UNAUTHENTICATED:-false}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_REDIRECT_URL: "${OIDC_REDIRECT_URL:-}"
      OIDC_SCOPES: "${OIDC_SCOPES:-openid profile email}"
      LOCAL_AS: "${LOCAL_AS:-}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    image: ghcr.io/nextmap-io/as-stats-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  clickhouse_data:
  clickhouse_logs:
