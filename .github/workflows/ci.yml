name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/as-stats

jobs:
  # ──────────────────────────────────────────────
  # Go: lint, test, build
  # ──────────────────────────────────────────────
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Run tests
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out

  # Every read / alert / retention / migration query against a real server,
  # on the ClickHouse version production runs today and on the next LTS, so a
  # change that only works on one of them fails here. The server gets the
  # shipped hot/cold storage policy (cold disk on a tmpfs) so the cold-tier and
  # flow-log migration tests run instead of skipping.
  go-integration:
    name: Go Integration (ClickHouse ${{ matrix.clickhouse }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        clickhouse: ["24.3-alpine", "26.8.33.10-alpine"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Start ClickHouse ${{ matrix.clickhouse }}
        run: |
          docker run -d --name ch -p 127.0.0.1:19000:9000 \
            --ulimit nofile=262144:262144 \
            --tmpfs /var/lib/clickhouse-cold:uid=101,gid=101 \
            -v "$PWD/clickhouse/config.d/storage-hot-cold.xml.example:/etc/clickhouse-server/config.d/storage-hot-cold.xml:ro" \
            -v "$PWD/clickhouse/config.d/system-logs-ttl.xml:/etc/clickhouse-server/config.d/system-logs-ttl.xml:ro" \
            -e CLICKHOUSE_DB=asstats -e CLICKHOUSE_SKIP_USER_SETUP=1 \
            clickhouse/clickhouse-server:${{ matrix.clickhouse }}
          for i in $(seq 60); do
            docker exec ch sh -c 'clickhouse-client --host "$(hostname -i)" -q "SELECT 1"' >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec ch clickhouse-client -q "SELECT version()"
      - name: Apply migrations
        # --database: the 000017 / 000018 guards look at currentDatabase().
        run: |
          for f in migrations/*.up.sql; do
            docker exec -i ch clickhouse-client --database asstats --multiquery < "$f"
          done
      - name: Integration tests
        env:
          ASSTATS_IT_CLICKHOUSE: 127.0.0.1:19000
        run: go test -count=1 ./internal/... -run Integration -v
      - name: ClickHouse server errors
        if: failure()
        run: docker exec ch tail -n 200 /var/log/clickhouse-server/clickhouse-server.err.log

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        binary: [collector, api, migrate]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Build ${{ matrix.binary }}
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/${{ matrix.binary }} ./cmd/${{ matrix.binary }}
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}-linux-amd64
          path: bin/${{ matrix.binary }}

  # ──────────────────────────────────────────────
  # Frontend: lint, typecheck, build
  # ──────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test

  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: TypeScript check
        run: npx tsc -b

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

  # ──────────────────────────────────────────────
  # Docker: build + push to GHCR (on main only)
  # ──────────────────────────────────────────────
  docker:
    name: Docker ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    needs: [go-test, go-build, frontend-test, frontend-build]
    strategy:
      matrix:
        image:
          - { name: collector, dockerfile: Dockerfile.collector }
          - { name: api, dockerfile: Dockerfile.api }
          - { name: migrate, dockerfile: Dockerfile.migrate }
          - { name: frontend, dockerfile: Dockerfile.frontend }
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
